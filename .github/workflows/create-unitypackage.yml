name: Create Unity Package

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a draft release with the built unitypackage
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
    # ghasec-ignore: unpinned-action
    - uses: AndanteTribe/Actions/actions/checkout@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
    - name: Extract version from package.json
      run: |
        version=$(jq -r '.version' Packages/jp.andantetribe.debugtoolkit/package.json)
        echo "PACKAGE_VERSION=${version}" >> $GITHUB_ENV
      # ghasec-ignore: unpinned-action
    - uses: AndanteTribe/Actions/actions/build-unitypackage@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
      with:
        package-path: Packages
        output-path: "a/DebugToolkit.${{ env.PACKAGE_VERSION }}.unitypackage"
    # ghasec-ignore: unpinned-action
    - uses: AndanteTribe/Actions/actions/upload-artifact@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
      with:
        path: a
        name: package
        retention-days: 2
    - name: Create draft release
      if: ${{ github.event.inputs.create_draft_release == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="v${PACKAGE_VERSION}"
        gh release create "$tag" "a/DebugToolkit.${PACKAGE_VERSION}.unitypackage" \
          --title "$tag" \
          --draft \
          --generate-notes
