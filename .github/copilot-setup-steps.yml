name: Copilot Setup Steps

on: push

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.23f1-base-3
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Set up machine-id
        run: |
          dbus-uuidgen > /etc/machine-id
          mkdir -p /var/lib/dbus
          ln -sf /etc/machine-id /var/lib/dbus/machine-id

      - uses: actions/checkout@v4

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-cache-DebugToolkit-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            unity-cache-DebugToolkit-

      - name: Get Unity Serial
        id: get-serial
        shell: bash
        run: |
          # Uses the same algorithm as game-ci/unity-test-runner (getSerialFromLicenseFile).
          # Python3 b64decode()[4:] correctly handles binary garbage bytes in positions 1-4.
          UNITY_SERIAL=$(python3 -c "import base64,re,os,sys;lic=os.environ.get('UNITY_LICENSE','');m=re.search('<DeveloperData Value=\"([^\"]+)\"',lic);sys.stdout.buffer.write(base64.b64decode(m.group(1))[4:] if m else b'')")
          if [[ -z "$UNITY_SERIAL" ]]; then
            echo "::error::Failed to extract Unity serial from UNITY_LICENSE. Check that UNITY_LICENSE secret is set correctly."
            exit 1
          fi
          echo "serial=$UNITY_SERIAL" >> "$GITHUB_OUTPUT"

      - name: Activate Unity License
        run: |
          unity-editor -quit -batchmode -logFile /dev/stdout \
            -serial "${{ steps.get-serial.outputs.serial }}" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -projectPath .

      - name: Import and compile Unity project
        run: |
          unity-editor -quit -batchmode -logFile /dev/stdout \
            -projectPath .
